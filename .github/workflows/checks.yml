name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify pinned tooling and lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath bun.lock)) { throw 'Missing bun.lock' }
          if ((bun --version).Trim() -ne (Get-Content .bun-version -Raw).Trim()) { throw 'Wrong Bun version' }
          if ((node --version).TrimStart('v').Trim() -ne (Get-Content .node-version -Raw).Trim()) { throw 'Wrong Node version' }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run ast:lint
      - run: bun run ast:test
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:tooling
      - run: bun run test:probe-fixture
      - run: bun run build

  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $pin = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"'
          if (-not $pin) { throw 'Missing Rust toolchain channel' }
          $toolchain = $pin.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - name: Verify pinned tooling and lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath bun.lock)) { throw 'Missing bun.lock' }
          if ((bun --version).Trim() -ne (Get-Content .bun-version -Raw).Trim()) { throw 'Wrong Bun version' }
          if ((node --version).TrimStart('v').Trim() -ne (Get-Content .node-version -Raw).Trim()) { throw 'Wrong Node version' }
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run tauri build --no-bundle -- --locked
