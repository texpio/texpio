name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: targets
        run: node scripts/platform-builds.js matrix

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify pinned tooling and lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath bun.lock)) { throw 'Missing bun.lock' }
          if ((bun --version).Trim() -ne (Get-Content .bun-version -Raw).Trim()) { throw 'Wrong Bun version' }
          if ((node --version).TrimStart('v').Trim() -ne (Get-Content .node-version -Raw).Trim()) { throw 'Wrong Node version' }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run ast:lint
      - run: bun run ast:test
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:tooling
      - run: bun run test:probe-fixture
      - run: bun run build

  native:
    name: Native ${{ matrix.id }}
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $pin = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"'
          if (-not $pin) { throw 'Missing Rust toolchain channel' }
          $toolchain = $pin.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
          rustup target add ${{ matrix.target }} --toolchain $toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libfuse2 libx11-dev libxtst-dev libxkbcommon-dev libsystemd-dev libatspi2.0-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.id }}
      - name: Verify pinned tooling and lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath bun.lock)) { throw 'Missing bun.lock' }
          if ((bun --version).Trim() -ne (Get-Content .bun-version -Raw).Trim()) { throw 'Wrong Bun version' }
          if ((node --version).TrimStart('v').Trim() -ne (Get-Content .node-version -Raw).Trim()) { throw 'Wrong Node version' }
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --no-default-features ${{ matrix.features }} --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --no-default-features ${{ matrix.features }}
      - name: Build downloadable preview
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: bun run tauri build ${{ matrix.previewArgs }}
      - name: Wayland helper checks
        if: matrix.variant == 'wayland'
        run: |
          cargo fmt --manifest-path native/wayland-helper/Cargo.toml --all -- --check
          cargo test --locked --manifest-path native/wayland-helper/Cargo.toml
          cargo clippy --locked --manifest-path native/wayland-helper/Cargo.toml --all-targets -- -D warnings
      - name: Package the separate Wayland helper
        if: matrix.variant == 'wayland'
        env:
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          cargo build --release --locked --manifest-path native/wayland-helper/Cargo.toml --target "$TARGET_ARCH"
          mkdir -p helper-packages
          arch=amd64
          if [ "$TARGET_ARCH" = aarch64-unknown-linux-gnu ]; then arch=arm64; fi
          sh packaging/linux-wayland/build-deb.sh "$arch" "native/wayland-helper/target/$TARGET_ARCH/release/texpio-wayland-helper" helper-packages
      - name: Prepare validated download contents
        run: node scripts/prepare-preview-artifact.js ${{ matrix.id }}
      - name: Upload preview download
        id: preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: texpio-preview-${{ matrix.id }}
          path: preview-artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Show download link
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
          PREVIEW_VARIANT: ${{ matrix.id }}
        run: |
          "### Download $env:PREVIEW_VARIANT" >> $env:GITHUB_STEP_SUMMARY
          "[Download test preview]($env:PREVIEW_URL) (retained for 14 days). Extract the ZIP and read README.md." >> $env:GITHUB_STEP_SUMMARY
