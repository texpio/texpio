name: Opt-in draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already committed (for example 0.2.0)
        required: true
        type: string
      confirm:
        description: Build signed artifacts and create a GitHub draft
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    if: inputs.confirm && vars.TEXPIO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Validate real release setup before writing anything
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/validate-release.js
      - id: targets
        run: node scripts/platform-builds.js matrix
      - name: Refuse an existing release or a tag at another commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'A release already exists; inspect it instead of replacing it.'
            exit 1
          fi
      - name: Create one shared draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --method POST \
            -f tag_name="v$RELEASE_VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Texpio $RELEASE_VERSION" -f body='Signed preview artifacts; review platform acceptance before publication.' \
            -F draft=true -F prerelease=false --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.draft.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install pinned Rust
        shell: pwsh
        run: |
          $pin = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"'
          if (-not $pin) { throw 'Missing Rust pin' }
          rustup toolchain install $pin.Matches[0].Groups[1].Value --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add ${{ matrix.target }} --toolchain $pin.Matches[0].Groups[1].Value
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.id }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libx11-dev libxtst-dev libxkbcommon-dev libsystemd-dev libatspi2.0-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Frozen dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath bun.lock)) { throw 'Missing bun.lock' }
          if ((bun --version).Trim() -ne (Get-Content .bun-version -Raw).Trim()) { throw 'Wrong Bun' }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build signed draft artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          tagName: v${{ inputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: ${{ runner.os != 'Linux' }}
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadPlainBinary: false
      - name: Package the separate Wayland helper preview
        if: matrix.variant == 'wayland'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          cargo build --release --locked --manifest-path native/wayland-helper/Cargo.toml
          mkdir -p helper-packages
          arch=amd64
          if [ "$TARGET_ARCH" = aarch64-unknown-linux-gnu ]; then arch=arm64; fi
          sh packaging/linux-wayland/build-deb.sh "$arch" native/wayland-helper/target/release/texpio-wayland-helper helper-packages
          gh release upload "v$RELEASE_VERSION" helper-packages/*.deb

  linux-update-feeds:
    needs: [draft, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Create independent signed Linux update manifests in the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          gh release download "v$RELEASE_VERSION" --pattern '*.sig' --dir signatures
          node scripts/platform-builds.js manifests release.json signatures
          gh release upload "v$RELEASE_VERSION" latest-linux-x11.json latest-linux-wayland.json
