[package]
name = "texpio"
version = "0.1.0"
description = "Texpio local-first text expander desktop foundation"
authors = ["Texpio contributors"]
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "texpio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
serde_yaml_ng = "=0.10.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"
tempfile = "3"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
log = "0.4"
tauri-plugin-log = "=2.10.1"
tauri-plugin-process = "=2.4.0"
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-persisted-scope = "=2.4.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_System_Com",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading",
    "Win32_System_SystemServices", "Win32_Security",
    "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
    "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "ef6e3090a6083c653955ca0b6e7f6c6ae1453d40" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
